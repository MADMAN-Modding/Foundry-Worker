[package]
name = "foundry_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
log = "0.4.34"
poise = "0.6.2"
rand = "0.10.2"
reqwest = "0.13.4"
serde_json = "1.0.151"
